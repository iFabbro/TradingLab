# Baseline prudente: solo errori reali (pyflakes, bugbear, errori di sintassi/logica).
# Le regole di stile sotto sono ignorate per ora e da ridurre gradualmente.
target-version = "py310"
extend-exclude = [".venv", "venv", "notebooks"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E402",  # import non in cima (hack sys.path negli script)
    "E701",  # piu' istruzioni sulla stessa riga
    "B905",  # zip() senza strict=
]
