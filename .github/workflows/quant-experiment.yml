name: Quant Experiment

on:
  push:
    branches: [main]
    paths-ignore:
      - 'experiments/registry.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite before quantitative experiment
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Run reproducible OOS Donchian Breakout experiment
        run: |
          python experiments/run_experiment.py \
            --symbol spy \
            --start 2015-01-01 \
            --end 2025-01-01 \
            --provider yfinance \
            --strategy donchian \
            --parameter-grid '{"lookback":[20,55,100,200]}' \
            --train-size 756 \
            --validation-size 252 \
            --test-size 252 \
            --step-size 252 \
            --transaction-cost-bps 5 \
            --slippage-bps 2 \
            --bootstrap-samples 5000 \
            --confidence 0.95 \
            --oos-block-length 20

      - name: Build gross-vs-net and full OOS trade audit
        run: PYTHONPATH="$GITHUB_WORKSPACE" python experiments/audit_experiment.py --run-dir experiments/results/spy_donchian_2015-01-01_2025-01-01_1d_yfinance

      - name: Run pre-registered benchmark, parameter plateau and untouched confirmation study
        run: PYTHONPATH="$GITHUB_WORKSPACE" python experiments/robustness_confirmation.py --symbol spy

      - name: Validate research artifacts
        run: |
          test -s experiments/results/spy_donchian_2015-01-01_2025-01-01_1d_yfinance/trade_log_oos_all.csv
          test -s experiments/results/spy_donchian_2015-01-01_2025-01-01_1d_yfinance/gross_vs_net_oos.csv
          test -s experiments/results/spy_donchian_2015-01-01_2025-01-01_1d_yfinance/gross_vs_net_oos.json
          test -s experiments/results/donchian_robustness_study/benchmark_donchian_vs_buy_hold.csv
          test -s experiments/results/donchian_robustness_study/validation_plateau.csv
          test -s experiments/results/donchian_robustness_study/validation_plateau.json
          test -s experiments/results/donchian_robustness_study/untouched_confirmation.json
          test -s experiments/registry.csv

      - name: Persist research registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/registry.csv
          git diff --cached --quiet || git commit -m "chore: update research registry"
          git push

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-experiment-spy-donchian
          path: experiments/results/
          if-no-files-found: warn
